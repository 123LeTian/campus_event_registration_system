spring:
  datasource:
    url: jdbc:h2:mem:campus_event_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      encoding: UTF-8
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: test-development-secret-change-me-test-development-secret-change-me
    expiration-ms: 7200000
  ai:
    api-key:
    model: test-model
    base-url: http://127.0.0.1:1/v1/chat/completions
    mock-enabled: true
    timeout-ms: 1000
